[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liver-histo-ai"
version = "0.1.0"
description = "Deep learning pipeline for tissue feature extraction and multi-omics fusion from H&E whole slide images of liver cancer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Liver-Histo-AI Contributors" }]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "openslide-python>=1.3.1",
    "pillow>=10.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "xgboost>=2.0",
    "lifelines>=0.28",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "requests>=2.31",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27",
]

[project.scripts]
liver-histo-pipeline = "liver_histo_ai.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
